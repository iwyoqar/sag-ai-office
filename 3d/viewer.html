<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SAG binosi 3D</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #cfdcec; }
    model-viewer { width: 100%; height: 100%; --poster-color: transparent; }
  </style>
</head>
<body>
  <model-viewer src="sag-bino.glb" camera-controls touch-action="pan-y"
    camera-orbit="25deg 78deg 85m" camera-target="0m 11m 2m" field-of-view="35deg"
    environment-image="neutral" exposure="1.05" shadow-intensity="1" shadow-softness="0.8"
    skybox-height="0m" alt="SAG ofis binosi"></model-viewer>
</body>
</html>
